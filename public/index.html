<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The Runway — Startup & Business News</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="masthead">
  <div class="masthead-inner">
    <h1 class="wordmark">The Runway</h1>
    <p class="tagline">Startup and business news, refreshed hourly</p>
  </div>
</header>

<main class="feed" id="feed">
  <p class="loading">Loading the latest stories…</p>
</main>

<template id="story-template">
  <article class="story">
    <div class="story-media">
      <img class="story-img" alt="" />
    </div>
    <div class="story-body">
      <div class="story-meta">
        <span class="story-source"></span>
        <span class="story-time"></span>
      </div>
      <h2 class="story-title"><a target="_blank" rel="noopener"></a></h2>
      <p class="story-summary"></p>

      <div class="story-actions">
        <button class="action-btn like-btn" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3H14z"/>
            <path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>
          </svg>
          <span class="like-count">0</span>
        </button>

        <button class="action-btn comment-toggle" type="button">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>
          </svg>
          <span class="comment-count">0</span>
        </button>

        <div class="share-row">
          <button class="action-btn share-btn" data-platform="whatsapp" type="button" title="Share on WhatsApp">WA</button>
          <button class="action-btn share-btn" data-platform="x" type="button" title="Share on X">X</button>
          <button class="action-btn share-btn" data-platform="linkedin" type="button" title="Share on LinkedIn">Li</button>
          <button class="action-btn share-btn" data-platform="copy" type="button" title="Copy link">Copy</button>
        </div>
      </div>

      <div class="comment-panel" hidden>
        <div class="comment-list"></div>
        <form class="comment-form">
          <input class="comment-name" type="text" placeholder="Your name" maxlength="60" required />
          <textarea class="comment-body" placeholder="Add a comment…" maxlength="1000" required></textarea>
          <button type="submit">Post comment</button>
        </form>
      </div>
    </div>
  </article>
</template>

<template id="comment-template">
  <div class="comment">
    <span class="comment-author"></span>
    <span class="comment-text"></span>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
